[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "promptcontrollab"
version = "0.1.0"
description = "Control-oriented diagnostics and reproducible regression testing for prompt changes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "PromptControlLab contributors" }
]
keywords = [
  "prompt-engineering",
  "llm-evaluation",
  "prompt-diagnostics",
  "soft-prompts",
  "control-theory"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.optional-dependencies]
research = [
  "numpy>=1.24",
  "scipy>=1.10"
]
hf = [
  "torch>=2.1",
  "transformers>=4.40"
]
dev = [
  "hatchling>=1.24",
  "mypy>=1.10",
  "numpy>=1.24",
  "pytest>=8.0",
  "ruff>=0.5",
  "scipy>=1.10"
]

[project.scripts]
pcl = "promptcontrollab.cli:main"

[project.urls]
Homepage = "https://github.com/VeraPyuyi/promptcontrollab"
Issues = "https://github.com/VeraPyuyi/promptcontrollab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/promptcontrollab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/promptcontrollab", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "scipy", "scipy.*"]
ignore_missing_imports = true
