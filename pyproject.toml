[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "promptcontrollab"
version = "0.1.0"
description = "Local control, attribution, and stability diagnostics for prompts and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "PromptControlLab contributors" }
]
keywords = [
  "prompt-engineering",
  "ai-agents",
  "agent-governance",
  "llm-evaluation",
  "model-provenance",
  "prompt-diagnostics",
  "control-theory",
  "deepseek"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.optional-dependencies]
research = [
  "numpy>=1.24,<2.0",
  "scipy>=1.10"
]
hf = [
  "numpy>=1.24,<2.0",
  "torch>=2.1",
  "transformers>=4.40"
]
ui = [
  "streamlit>=1.40",
  "plotly>=5.24"
]
bot = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8"
]
dev = [
  "build>=1.2",
  "hatchling>=1.24",
  "mypy>=1.10",
  "numpy>=1.24,<2.0",
  "pytest>=8.0",
  "ruff>=0.5",
  "scipy>=1.10"
]

[project.scripts]
pcl = "promptcontrollab.cli:main"

[project.urls]
Homepage = "https://github.com/VeraPyuyi/prompt_control_lab"
Issues = "https://github.com/VeraPyuyi/prompt_control_lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/promptcontrollab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/promptcontrollab", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "scipy", "scipy.*"]
ignore_missing_imports = true
