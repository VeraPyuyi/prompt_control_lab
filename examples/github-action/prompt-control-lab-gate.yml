name: PromptControlLab Gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  pcl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PromptControlLab
        run: python -m pip install -e .

      - name: Run PromptControlLab gate
        run: pcl gate --run runs/quick --policy examples/gate.policy.yaml

      - name: Audit PR diff
        if: always()
        run: |
          pcl audit-diff \
            --before "${{ github.event.pull_request.base.sha }}" \
            --after "${{ github.event.pull_request.head.sha }}" \
            --out runs/agent-audit

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const gate = JSON.parse(fs.readFileSync("runs/quick/gate_result.json", "utf8"));
            let audit = {};
            try {
              audit = JSON.parse(fs.readFileSync("runs/agent-audit/audit_result.json", "utf8"));
            } catch (error) {
              audit = { human_review_required: "unknown" };
            }
            const body = [
              "## PromptControlLab Gate",
              "",
              `Status: ${gate.status}`,
              `Reason: ${gate.plain_summary || gate.what_this_means || "See gate_result.json."}`,
              `Agent audit review required: ${audit.human_review_required}`,
            ].join("\n");
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
