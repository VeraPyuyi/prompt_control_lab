name: PromptControlLab Gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  pcl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PromptControlLab
        run: python -m pip install -e .

      - name: Prepare PromptControlLab run artifacts
        shell: bash
        run: |
          if [ -f runs/quick/manifest.json ]; then
            echo "Using existing runs/quick artifacts."
          elif [ -f promptcontrol.example.yaml ]; then
            pcl analyze --config promptcontrol.example.yaml --out runs/quick
          else
            echo "No runs/quick artifacts or promptcontrol.example.yaml found."
            echo "Commit a run artifact, or add a promptcontrol.example.yaml config."
            mkdir -p runs/quick
            cat > runs/quick/gate_result.json <<'JSON'
          {
            "status": "needs_review",
            "plain_summary": "gate_result.json was not found and no promptcontrol.example.yaml config was available."
          }
          JSON
          fi

      - name: Run PromptControlLab gate
        shell: bash
        run: |
          if [ -f runs/quick/manifest.json ]; then
            pcl gate --run runs/quick --policy examples/gate.policy.yaml
          else
            echo "Skipping gate because runs/quick was not generated."
          fi

      - name: Audit PR diff
        if: always()
        run: |
          pcl audit-diff \
            --before "${{ github.event.pull_request.base.sha }}" \
            --after "${{ github.event.pull_request.head.sha }}" \
            --out runs/agent-audit

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let gate = {};
            try {
              gate = JSON.parse(fs.readFileSync("runs/quick/gate_result.json", "utf8"));
            } catch (error) {
              gate = {
                status: "needs_review",
                plain_summary: "gate_result.json was not found; check the prepare/gate steps.",
              };
            }
            let audit = {};
            try {
              audit = JSON.parse(fs.readFileSync("runs/agent-audit/audit_result.json", "utf8"));
            } catch (error) {
              audit = { human_review_required: "unknown" };
            }
            const body = [
              "## PromptControlLab Gate",
              "",
              `Status: ${gate.status}`,
              `Reason: ${gate.plain_summary || gate.what_this_means || "See gate_result.json."}`,
              `Agent audit review required: ${audit.human_review_required}`,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
