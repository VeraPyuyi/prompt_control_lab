<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
  <title id="title">专家模式命令图</title>
  <desc id="desc">专家模式提供 split、eval、stats、explain、gate、report 和研究诊断命令。</desc>
  <rect width="1100" height="340" rx="18" fill="#f8fafc"/>
  <text x="44" y="54" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#172033">专家模式：按你的需要组合分析流程</text>
  <g font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif">
    <rect x="60" y="110" width="145" height="58" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="133" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">切分</text>
    <rect x="230" y="110" width="145" height="58" rx="10" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
    <text x="303" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">打分</text>
    <rect x="400" y="110" width="145" height="58" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="473" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">统计</text>
    <rect x="570" y="110" width="145" height="58" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <text x="643" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">解释</text>
    <rect x="740" y="110" width="145" height="58" rx="10" fill="#ffffff" stroke="#fb7185" stroke-width="2"/>
    <text x="813" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">阈值判断</text>
    <rect x="910" y="110" width="145" height="58" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="983" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">报告</text>

    <rect x="145" y="225" width="170" height="58" rx="10" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <text x="230" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">软硬转换</text>
    <rect x="350" y="225" width="170" height="58" rx="10" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/>
    <text x="435" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">轨迹分析</text>
    <rect x="555" y="225" width="170" height="58" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="640" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Riccati诊断</text>
    <rect x="760" y="225" width="170" height="58" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
    <text x="845" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">时变对比</text>
  </g>
</svg>
