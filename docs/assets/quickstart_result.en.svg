<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">PromptControlLab quickstart report snapshot</title>
  <desc id="desc">A synthetic quickstart report that recommends review because the score increase remains statistically uncertain and prompt identity is incomplete.</desc>
  <rect width="1600" height="720" fill="#f7f9fc"/>
  <text x="80" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#172b4d">Quickstart report snapshot</text>
  <text x="80" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#526581">Fixed synthetic fixture · promptcontrollab 0.2.0a1 · exact_match · 4 examples</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="80" y="158" width="330" height="126" rx="8" fill="#fffaf0" stroke="#e6b85c" stroke-width="2"/>
    <text x="110" y="198" font-size="18" fill="#526581">Decision</text>
    <text x="110" y="248" font-size="31" font-weight="700" fill="#8a4b08">needs_review</text>

    <rect x="450" y="158" width="330" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="480" y="198" font-size="18" fill="#526581">Candidate score</text>
    <text x="480" y="248" font-size="34" font-weight="700" fill="#1f4b7a">1.00</text>

    <rect x="820" y="158" width="330" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="850" y="198" font-size="18" fill="#526581">Mean delta</text>
    <text x="850" y="248" font-size="34" font-weight="700" fill="#276749">+0.25</text>

    <rect x="1190" y="158" width="330" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1220" y="198" font-size="18" fill="#526581">Bootstrap CI</text>
    <text x="1220" y="248" font-size="31" font-weight="700" fill="#172b4d">[0.00, 0.75]</text>
  </g>

  <rect x="80" y="326" width="700" height="270" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="118" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1f4b7a">What the run observed</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#243b53">
    <circle cx="126" cy="424" r="7" fill="#2d9d65"/><text x="148" y="432">One arithmetic example was fixed; none were broken.</text>
    <circle cx="126" cy="473" r="7" fill="#2d9d65"/><text x="148" y="481">Train, validation, and withheld sets had no leakage.</text>
    <circle cx="126" cy="522" r="7" fill="#2f6fed"/><text x="148" y="530">Baseline and candidate recorded the same public model ID.</text>
    <circle cx="126" cy="571" r="7" fill="#2f6fed"/><text x="148" y="579">The candidate was higher on this fixed fixture.</text>
  </g>

  <rect x="820" y="326" width="700" height="270" rx="8" fill="#fffaf0" stroke="#e6b85c" stroke-width="2"/>
  <text x="858" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#8a4b08">Why the gate asks for review</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#243b53">
    <circle cx="866" cy="424" r="7" fill="#d97706"/><text x="888" y="432">The confidence interval crosses zero; p-value is 1.00.</text>
    <circle cx="866" cy="473" r="7" fill="#d97706"/><text x="888" y="481">Prompt identity was not recorded for a clean prompt-only claim.</text>
    <circle cx="866" cy="522" r="7" fill="#d97706"/><text x="888" y="530">The model ID is an alias rather than a pinned dated version.</text>
    <circle cx="866" cy="571" r="7" fill="#d97706"/><text x="888" y="579">Next action: inspect the evidence before keeping the change.</text>
  </g>

  <rect x="80" y="630" width="1440" height="58" rx="8" fill="#172b4d"/>
  <text x="800" y="667" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#ffffff">Synthetic workflow check, not evidence of universal prompt improvement.</text>
</svg>
