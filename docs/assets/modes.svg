<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">prompt_control_lab two modes</title>
  <desc id="desc">Quick Mode creates a report from one command, while Expert Mode exposes each diagnostic command.</desc>
  <rect width="1100" height="390" rx="18" fill="#f8fafc"/>
  <text x="44" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Two modes, one artifact trail</text>
  <text x="44" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Use Quick Mode for a direct report, or Expert Mode for fine-grained control.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="125" width="455" height="205" rx="14" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <text x="88" y="165" font-size="23" font-weight="700" fill="#0f172a">Quick Mode</text>
    <text x="88" y="195" font-size="15" fill="#475569">For non-specialists and fast reviews</text>
    <rect x="88" y="222" width="170" height="42" rx="8" fill="#e0f2fe"/>
    <text x="173" y="249" text-anchor="middle" font-size="16" font-weight="700" fill="#075985">pcl analyze</text>
    <text x="88" y="292" font-size="15" fill="#334155">Outputs: split, metrics, stats, explanation, report</text>

    <rect x="585" y="125" width="455" height="205" rx="14" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="613" y="165" font-size="23" font-weight="700" fill="#0f172a">Expert Mode</text>
    <text x="613" y="195" font-size="15" fill="#475569">For researchers and engineering teams</text>
    <rect x="613" y="222" width="170" height="42" rx="8" fill="#dcfce7"/>
    <text x="698" y="249" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">pcl split + eval</text>
    <text x="613" y="292" font-size="15" fill="#334155">Control each step: stats, soft-hard, trajectory, Riccati</text>
  </g>
</svg>
