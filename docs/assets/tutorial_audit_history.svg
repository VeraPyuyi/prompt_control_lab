<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="prompt_control_lab audit and history tutorial">
  <rect width="1100" height="420" fill="#f8fafc"/>
  <text x="44" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Audit and History</text>
  <text x="44" y="88" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">See what the agent changed, then track risk and model drift over runs.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="80" y="135" width="285" height="160" rx="14" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text x="108" y="174" font-size="18" font-weight="700" fill="#991b1b">audit_result.json</text>
    <text x="108" y="208" font-size="13" fill="#475569">changed lines</text>
    <text x="108" y="236" font-size="13" fill="#475569">dangerous paths</text>
    <text x="108" y="264" font-size="13" fill="#475569">tests and secrets</text>

    <rect x="425" y="135" width="285" height="160" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="453" y="174" font-size="18" font-weight="700" fill="#5b21b6">agent_run.json</text>
    <text x="453" y="208" font-size="13" fill="#475569">prompt and policy</text>
    <text x="453" y="236" font-size="13" fill="#475569">model and agent</text>
    <text x="453" y="264" font-size="13" fill="#475569">review_required</text>

    <rect x="770" y="135" width="285" height="160" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="798" y="174" font-size="18" font-weight="700" fill="#1e3a8a">history_index.json</text>
    <text x="798" y="208" font-size="13" fill="#475569">score trend</text>
    <text x="798" y="236" font-size="13" fill="#475569">gate trend</text>
    <text x="798" y="264" font-size="13" fill="#475569">model changes</text>

    <line x1="375" y1="215" x2="415" y2="215" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="720" y1="215" x2="760" y2="215" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
