<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Capability comparison matrix</title>
  <desc id="desc">A high-level comparison between common LLM tool families and prompt_control_lab.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff}.title{font:700 28px Arial,sans-serif;fill:#102033}.note{font:400 14px Arial,sans-serif;fill:#64748b}
      .head{fill:#0f172a}.headText{font:700 13px Arial,sans-serif;fill:#ffffff}.rowA{fill:#f8fafc}.rowB{fill:#ffffff}
      .cell{stroke:#d7dee8;stroke-width:1}.label{font:700 14px Arial,sans-serif;fill:#102033}.txt{font:400 13px Arial,sans-serif;fill:#334155}
      .strong{fill:#ecfeff}.strongText{font:700 13px Arial,sans-serif;fill:#0e7490}.midText{font:700 13px Arial,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1100" height="500"/>
  <text x="40" y="46" class="title">Capability View: What prompt_control_lab Adds</text>
  <text x="40" y="72" class="note">This is a positioning guide, not a replacement claim. Adjacent tools remain useful for their own workflows.</text>

  <g transform="translate(40,105)">
    <rect width="1020" height="44" class="head"/>
    <text x="18" y="28" class="headText">Tool family</text>
    <text x="210" y="20" class="headText">Prompt or</text><text x="210" y="36" class="headText">program tuning</text>
    <text x="360" y="20" class="headText">Eval, CI,</text><text x="360" y="36" class="headText">red-team tests</text>
    <text x="505" y="20" class="headText">Trace and</text><text x="505" y="36" class="headText">monitoring</text>
    <text x="640" y="20" class="headText">Reproducible eval</text><text x="640" y="36" class="headText">and paired stats</text>
    <text x="805" y="20" class="headText">Agent preflight,</text><text x="805" y="36" class="headText">model provenance</text>

    <rect y="44" width="1020" height="70" class="rowA cell"/>
    <text x="18" y="75" class="label">Optimizers</text><text x="18" y="96" class="txt">DSPy, TextGrad, OpenPrompt</text>
    <text x="226" y="85" class="strongText">Core</text>
    <text x="380" y="85" class="midText">Some</text>
    <text x="532" y="85" class="txt">Usually external</text>
    <text x="668" y="85" class="txt">Add-on need</text>
    <text x="840" y="85" class="txt">Rare focus</text>

    <rect y="114" width="1020" height="70" class="rowB cell"/>
    <text x="18" y="145" class="label">Eval and testing</text><text x="18" y="166" class="txt">promptfoo, DeepEval</text>
    <text x="226" y="155" class="txt">Some</text>
    <text x="380" y="155" class="strongText">Core</text>
    <text x="532" y="155" class="txt">Some</text>
    <text x="668" y="155" class="txt">Possible</text>
    <text x="840" y="155" class="txt">Rare focus</text>

    <rect y="184" width="1020" height="70" class="rowA cell"/>
    <text x="18" y="215" class="label">Observability</text><text x="18" y="236" class="txt">Langfuse, LangSmith, Phoenix</text>
    <text x="226" y="225" class="txt">Some</text>
    <text x="380" y="225" class="txt">Some</text>
    <text x="532" y="225" class="strongText">Core</text>
    <text x="668" y="225" class="txt">Possible</text>
    <text x="840" y="225" class="txt">Limited</text>

    <rect y="254" width="1020" height="86" class="strong cell"/>
    <text x="18" y="289" class="label">prompt_control_lab</text><text x="18" y="312" class="txt">Preflight and provenance</text>
    <text x="226" y="302" class="txt">Simple rewrite</text>
    <text x="380" y="302" class="txt">Local scoring</text>
    <text x="532" y="302" class="txt">Artifact trail</text>
    <text x="668" y="302" class="strongText">Core</text>
    <text x="840" y="302" class="strongText">Core</text>
  </g>
</svg>
