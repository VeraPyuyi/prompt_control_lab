<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Reach v2 evidence overview</title>
  <desc id="desc">Two read-only evidence snapshots are reconciled into five bounded diagnostic adapters and one portable package.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <text x="80" y="82" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172b4d">prompt_control_lab · Prompt Reach v2</text>
  <text x="80" y="128" font-family="Arial, sans-serif" font-size="24" fill="#526581">Read-only evidence → canonical reconciliation → bounded interpretation</text>
  <rect x="80" y="205" width="340" height="210" rx="8" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/>
  <text x="110" y="258" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f4b7a">Local snapshot</text>
  <text x="110" y="312" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#172b4d">198</text>
  <text x="110" y="354" font-family="Arial, sans-serif" font-size="23" fill="#526581">structured source records</text>
  <text x="110" y="390" font-family="Arial, sans-serif" font-size="20" fill="#526581">read-only · hashed · redacted</text>
  <rect x="80" y="485" width="340" height="210" rx="8" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/>
  <text x="110" y="538" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f4b7a">Server snapshot</text>
  <text x="110" y="592" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#172b4d">371</text>
  <text x="110" y="634" font-family="Arial, sans-serif" font-size="23" fill="#526581">structured source records</text>
  <text x="110" y="670" font-family="Arial, sans-serif" font-size="20" fill="#526581">173 additional · 0 conflicts</text>
  <path d="M430 310 H530" stroke="#2f80ed" stroke-width="6" fill="none"/>
  <path d="M430 590 H530" stroke="#2f80ed" stroke-width="6" fill="none"/>
  <path d="M515 294 L545 310 L515 326 Z" fill="#2f80ed"/>
  <path d="M515 574 L545 590 L515 606 Z" fill="#2f80ed"/>
  <rect x="550" y="205" width="430" height="490" rx="8" fill="#ffffff" stroke="#2f80ed" stroke-width="4"/>
  <text x="590" y="264" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#153e75">Five diagnostic adapters</text>
  <g font-family="Arial, sans-serif" font-size="24" fill="#243b53">
    <text x="600" y="333">1 · Prompt reachability</text>
    <text x="600" y="400">2 · Readout alignment</text>
    <text x="600" y="467">3 · Prompt routing</text>
    <text x="600" y="534">4 · Prompt projection</text>
    <text x="600" y="601">5 · Prompt stability</text>
  </g>
  <text x="600" y="655" font-family="Arial, sans-serif" font-size="20" fill="#7b341e">4 observed · 1 requires reanalysis</text>
  <path d="M990 450 H1090" stroke="#2f80ed" stroke-width="6" fill="none"/>
  <path d="M1075 434 L1105 450 L1075 466 Z" fill="#2f80ed"/>
  <rect x="1110" y="205" width="410" height="490" rx="8" fill="#ffffff" stroke="#3b8c6e" stroke-width="4"/>
  <text x="1150" y="264" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#276749">Portable evidence package</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#243b53">
    <text x="1150" y="333">Observed evidence</text>
    <text x="1150" y="395">Interpretation scope</text>
    <text x="1150" y="457">Claim boundary</text>
    <text x="1150" y="519">Next action</text>
    <text x="1150" y="581">Source hashes</text>
  </g>
  <rect x="1150" y="624" width="320" height="42" rx="6" fill="#e6fffa"/>
  <text x="1170" y="653" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#276749">No raw prompts or model weights</text>
  <rect x="80" y="760" width="1440" height="76" rx="8" fill="#172b4d"/>
  <text x="120" y="808" font-family="Arial, sans-serif" font-size="25" fill="#ffffff">Interpretive evidence, not a universal improvement claim or strict causal proof.</text>
</svg>
