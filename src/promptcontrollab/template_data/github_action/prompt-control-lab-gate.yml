name: PromptControlLab Gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  pcl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PromptControlLab
        run: python -m pip install -e .
      - name: Prepare PromptControlLab run artifacts
        shell: bash
        run: |
          if [ -f runs/quick/manifest.json ]; then
            echo "Using existing runs/quick artifacts."
          elif [ -f promptcontrol.example.yaml ]; then
            pcl analyze --config promptcontrol.example.yaml --out runs/quick
          else
            echo "No runs/quick artifacts or promptcontrol.example.yaml found."
            mkdir -p runs/quick
            cat > runs/quick/manifest.json <<'JSON'
          {
            "mode": "ci-fallback",
            "method": "missing-artifact",
            "metric": "unknown",
            "model_warnings": [
              "No PromptControlLab run artifact or promptcontrol.example.yaml config was available."
            ]
          }
          JSON
            cat > runs/quick/gate_result.json <<'JSON'
          {
            "status": "needs_review",
            "plain_summary": "gate_result.json was not found and no promptcontrol.example.yaml config was available."
          }
          JSON
          fi
      - name: Run PromptControlLab gate
        shell: bash
        run: |
          if [ -f runs/quick/candidate/metrics.json ] || [ -f runs/quick/metrics.json ]; then
            pcl gate --run runs/quick --policy examples/gate.policy.yaml
          else
            echo "Skipping gate because runs/quick does not contain metrics artifacts."
          fi
      - name: Audit PR diff
        if: always()
        run: |
          pcl audit-diff \
            --before "${{ github.event.pull_request.base.sha }}" \
            --after "${{ github.event.pull_request.head.sha }}" \
            --out runs/agent-audit
      - name: Build PR summary
        if: always()
        run: |
          pcl pr-summary \
            --audit runs/agent-audit/audit_result.json \
            --gate runs/quick/gate_result.json \
            --out runs/pr_summary.md \
            --json-out runs/pr_summary.json
