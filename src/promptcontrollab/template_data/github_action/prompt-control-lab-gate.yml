name: PromptControlLab Gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  pcl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PromptControlLab
        run: python -m pip install -e .
      - name: Prepare PromptControlLab run artifacts
        shell: bash
        run: |
          if [ -f runs/quick/manifest.json ]; then
            echo "Using existing runs/quick artifacts."
          elif [ -f promptcontrol.example.yaml ]; then
            pcl analyze --config promptcontrol.example.yaml --out runs/quick
          else
            echo "No runs/quick artifacts or promptcontrol.example.yaml found."
            mkdir -p runs/quick
            cat > runs/quick/manifest.json <<'JSON'
          {
            "mode": "ci-fallback",
            "method": "missing-artifact",
            "metric": "unknown",
            "model_warnings": [
              "No PromptControlLab run artifact or promptcontrol.example.yaml config was available."
            ]
          }
          JSON
            cat > runs/quick/gate_result.json <<'JSON'
          {
            "status": "needs_review",
            "plain_summary": "gate_result.json was not found and no promptcontrol.example.yaml config was available."
          }
          JSON
          fi
      - name: Run PromptControlLab gate
        shell: bash
        run: |
          if [ -f runs/quick/candidate/metrics.json ] || [ -f runs/quick/metrics.json ]; then
            pcl gate --run runs/quick --policy examples/gate.policy.yaml
          else
            echo "Skipping gate because runs/quick does not contain metrics artifacts."
          fi
      - name: Run PromptControlLab evidence gate
        if: always()
        shell: bash
        run: |
          if [ -f runs/quick/research_bundle.json ]; then
            pcl evidence-gate --run runs/quick --strict
          else
            echo "Skipping evidence gate because runs/quick has no research_bundle.json."
          fi
      - name: Audit PR diff
        if: always()
        run: |
          pcl audit-diff \
            --before "${{ github.event.pull_request.base.sha }}" \
            --after "${{ github.event.pull_request.head.sha }}" \
            --out runs/agent-audit
      - name: Build PR summary
        if: always()
        run: |
          pcl pr-summary \
            --audit runs/agent-audit/audit_result.json \
            --gate runs/quick/gate_result.json \
            --evidence-gate runs/quick/evidence_gate_result.json \
            --out runs/pr_summary.md \
            --json-out runs/pr_summary.json
      - name: Post PromptControlLab summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- prompt-control-lab-summary -->";
            let body = "## PromptControlLab Gate\n\nNo summary artifact was generated.";
            try {
              body = fs.readFileSync("runs/pr_summary.md", "utf8");
            } catch (error) {
              body = "## PromptControlLab Gate\n\npr_summary.md was not found; check the prepare/gate/audit steps.";
            }
            body = `${marker}\n${body}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
