name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            plugins/deepseek-harness/package-lock.json
      - name: Install uv
        run: python -m pip install uv
      - name: Install package
        run: uv pip install --system -e ".[dev,research]"
      - name: Install DeepSeek Harness plugin dependencies
        working-directory: plugins/deepseek-harness
        run: npm ci
      - name: Install workflow cockpit dependencies
        working-directory: frontend
        run: npm ci
      - name: DeepSeek Harness plugin contracts
        working-directory: plugins/deepseek-harness
        run: npm run check
      - name: Workflow cockpit tests and build
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest
      - name: Distribution smoke
        run: |
          python -m build --no-isolation
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          tar -tf "$sdist" > .sdist-contents.txt
          if grep -E '(^|/)(\.git|\.venv|build|dist|node_modules|runs)(/|$)|\.mp4$' .sdist-contents.txt; then
            echo "sdist contains a forbidden local or generated path"
            exit 1
          fi
          python -m venv .wheel-smoke
          . .wheel-smoke/bin/activate
          python -m pip install --no-index --find-links dist promptcontrollab
          pcl --help
          pcl install-plugin all --target .wheel-smoke/templates
          test -f .wheel-smoke/templates/codex/SKILL.md
          test -f .wheel-smoke/templates/cursor/prompt_control_lab.mdc
          test -f .wheel-smoke/templates/claude-code/prompt_guard.py
          test -f .wheel-smoke/templates/github-action/prompt-control-lab-gate.yml
          test -z "$(find .wheel-smoke/templates -name __pycache__ -o -name '*.pyc')"
          pcl import prompt-optimizer \
            --input examples/external/prompt_optimizer_favorites.json \
            --out .wheel-smoke/from-prompt-optimizer
          pcl scaffold-check --run .wheel-smoke/from-prompt-optimizer
          test -f .wheel-smoke/from-prompt-optimizer/eval_scaffold/scaffold_check.json
          test -f .wheel-smoke/from-prompt-optimizer/eval_scaffold/scaffold_check.html
      - name: Wheel research smoke
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          pcl research-demo --out .wheel-research/research-demo
          pcl diagnose --run .wheel-research/research-demo
          test -f .wheel-research/research-demo/research_bundle.html
          test -f .wheel-research/research-demo/research_diagnostics.html
          test -f .wheel-research/research-demo/evidence_card.html
          test -f .wheel-research/research-demo/claim_check.html
